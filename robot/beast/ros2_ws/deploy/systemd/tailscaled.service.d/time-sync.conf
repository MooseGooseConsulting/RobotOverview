# tailscaled time-sync drop-in — wait for NTP before starting tailscaled.
# The Orin Nano dev kit has no RTC battery; cold boot starts at epoch 0.
# Without this, tailscaled rejects control plane certs as "not yet valid"
# because the system clock is decades behind the cert validity window.
# Install to /etc/systemd/system/tailscaled.service.d/time-sync.conf
# Installed 2026-08-10 after the cockpit outage root-caused to RTC-not-persisting.
[Unit]
After=time-sync.target systemd-timesyncd.service
Wants=time-sync.target
