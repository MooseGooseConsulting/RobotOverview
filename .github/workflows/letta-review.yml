name: Letta PR Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  review:
    name: Letta Deep Review

    # Internal PRs only. Fork PRs don't receive organization secrets anyway.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: moosegoose-general
    timeout-minutes: 20

    # Serialize revisions of ONE PR, not all PRs.
    concurrency:
      group: letta-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          # Do NOT persist the write-scoped github.token into the working tree.
          persist-credentials: false

      - name: Pre-install Bun in tool cache
        run: |
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-$HOME/_work/_tool}"
          BUN_CACHE_DIR="$TOOL_CACHE/bun/1.2.11/x64"
          mkdir -p "$BUN_CACHE_DIR"
          if [ ! -f "$BUN_CACHE_DIR/bun" ]; then
            BUN_URL="https://github.com/oven-sh/bun/releases/download/bun-v1.2.11/bun-linux-x64.zip"
            curl -fsSL "$BUN_URL" -o /tmp/bun.zip
            unzip -q -o /tmp/bun.zip -d /tmp
            mv -f /tmp/bun-linux-x64/bun "$BUN_CACHE_DIR/bun"
            chmod +x "$BUN_CACHE_DIR/bun"
            touch "$TOOL_CACHE/bun/1.2.11/x64.complete"
            rm -rf /tmp/bun.zip /tmp/bun-linux-x64
          fi
          echo "$BUN_CACHE_DIR" >> "$GITHUB_PATH"

      - name: Letta deep review
        id: letta
        # Pin the action while it remains experimental.
        uses: letta-ai/letta-code-action@daa80f29e345315623ff759f5ecf5018946bbc15
        with:
          letta_api_key: ${{ secrets.LETTA_API_KEY }}
          github_token: ${{ github.token }}
          agent_id: agent-20812d4a-e8e4-49f2-bb4b-e482fabaf6e6

          model: auto

          track_progress: ""
          tracking_comment: "false"

          prompt: |
            Perform a deep code review of PR
            #${{ github.event.pull_request.number }}
            in ${{ github.repository }}.

            Reviewed head SHA:
            ${{ github.event.pull_request.head.sha }}

            First identify the full repository identity and retrieve any
            repository-specific knowledge you have for it.

            Read applicable AGENTS.md/project instructions.

            Read the PR title, body and relevant discussion:

              gh pr view ${{ github.event.pull_request.number }} \
                --json title,body,comments,baseRefName,headRefName

            Read the complete diff:

              gh pr diff ${{ github.event.pull_request.number }}

            Understand the intended change before looking for defects.

            Use your established deep-review procedure.

            For a non-trivial PR, use up to three parallel independent
            subagents:

            1. correctness / regression / state / concurrency
            2. tests / callers / integration / validation
            3. architecture / security / domain-specific risk

            For a tiny or obviously simple PR, use fewer if additional
            agents provide no useful independent coverage.

            Subagents investigate only. They must not publish to GitHub.

            Collect their candidate findings, deduplicate them, and
            independently try to disprove each candidate.

            Follow relevant execution paths and surrounding code when
            necessary. Do not restrict analysis mechanically to the diff.

            Only report a finding when:
            - there is a concrete incorrect behavior or material risk;
            - the execution path is realistic;
            - surrounding code does not already prevent it;
            - this PR introduces or materially worsens it;
            - the cited code and line are correct.

            Default posture: signal only. Most good PRs should pass.

            Never flag style, subjective implementation preferences,
            generic best practices, speculative hardening, unrelated
            pre-existing defects, or invented requirements.

            If substantive findings survive verification, create concise
            inline GitHub review comments on the exact changed lines.
            Do not create a separate verbose summary comment.

            Do not modify files, commit, push or merge.

            After the review, retain only genuinely durable lessons,
            generalizing techniques globally and namespacing repository
            facts under ${{ github.repository }}.

            If no substantive findings remain, finish exactly:

            LGTM

            If substantive findings were published, finish exactly:

            NEEDS_CHANGES

      - name: Interpret review result
        if: always()
        shell: bash
        run: |
          FILE="${{ steps.letta.outputs.execution_file }}"

          if [[ -z "$FILE" || ! -f "$FILE" ]]; then
            echo "::error::Letta did not produce an execution result."
            exit 1
          fi

          RESULT="$(
            jq -s -r \
              '[.[] | select(.type == "result") | .result] | last // ""' \
              "$FILE"
          )"

          echo "Letta result: $RESULT"

          VERDICT="$(
            echo "$RESULT" \
              | grep -v '^[[:space:]]*$' \
              | tail -n 1
          )"

          echo "Parsed verdict: ${VERDICT:-<none>}"

          case "$VERDICT" in
            LGTM)
              echo "Review passed."
              exit 0
              ;;
            NEEDS_CHANGES)
              echo "::warning::Letta found substantive review issues."
              exit 0
              ;;
            *)
              echo "::error::Unexpected Letta result."
              exit 1
              ;;
          esac
