name: Beast power tests

on:
  pull_request:
    paths:
      - 'robot/beast/ros2_ws/src/ugv_main/beast_power/**'
      - '.github/workflows/beast-power-tests.yml'
  push:
    branches: [main]
    paths:
      - 'robot/beast/ros2_ws/src/ugv_main/beast_power/**'
      - '.github/workflows/beast-power-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Host tier (strict stubs, no ROS): runs anywhere, fast, deterministic.
  # Deselects the integration tier so the two lanes are disjoint — the
  # integration module also self-skips when rclpy is absent, but the marker
  # keeps the host lane honest about what it actually exercised.
  power:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-general' }}
    defaults:
      run:
        working-directory: robot/beast/ros2_ws
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: pip install pytest
      - run: python -m pytest src/ugv_main/beast_power/test -q -m "not integration"

  # Integration tier (real rclpy + DDS over loopback) in the ROS 2 Humble
  # container. Plain pytest + PYTHONPATH: colcon build would install nothing
  # extra and only slow the lane down.
  integration:
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-general' }}
    container: ros:humble-ros-base@sha256:75dd3aba34a3838dadbb31a9f7bef769bdfa8713e6cec686fc868db2981b0987
    env:
      # Nodes discover each other on loopback only — faster, and immune to
      # whatever else is running on the shared runner.
      ROS_LOCALHOST_ONLY: '1'
    defaults:
      run:
        # Container jobs default to `sh`; the ROS setup scripts need bash.
        shell: bash
    steps:
      # The ros-base image ships neither git (checkout needs it) nor pytest.
      - name: Install git, pip, pytest
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3-pip
          pip install --no-cache-dir pytest
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Integration suite (real rclpy over DDS)
        working-directory: robot/beast/ros2_ws
        run: |
          source /opt/ros/humble/setup.bash
          # Append to the ROS PYTHONPATH (rclpy lives on it) — never replace it.
          PYTHONPATH="src/ugv_main/beast_power${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -m pytest -q \
            -m integration src/ugv_main/beast_power/test/integration
