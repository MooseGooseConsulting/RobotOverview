name: Build BEAST ROS image

on:
  pull_request:
    paths:
      - 'robot/beast/ros2_ws/**'
      - '.github/workflows/beast-ros-image.yml'
  push:
    branches:
      - main
    paths:
      - 'robot/beast/ros2_ws/**'
      - '.github/workflows/beast-ros-image.yml'
  workflow_dispatch:

# Default least-privilege; the publishing job widens its own scope below.
permissions:
  contents: read

# Avoid overlapping builds for the same ref. Cancel superseded PR runs, but never
# cancel a main publish mid-flight — a canceled main run leaves a SHA with no image.
concurrency:
  group: beast-ros-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: moosegooseconsulting/beast-ros

jobs:
  image:
    name: Build and publish beast-ros (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out RobotOverview
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # QEMU required for linux/arm64 on ubuntu-latest (amd64) runners.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=pr,prefix=pr-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build arm64 image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: robot/beast/ros2_ws
          file: robot/beast/ros2_ws/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=beast-ros
          cache-to: type=gha,mode=max,scope=beast-ros
