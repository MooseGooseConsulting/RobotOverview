name: CI tools tests

# tools/ci/ holds code that runs only on the deploy path, where a silent no-op
# is indistinguishable from success: the pin writer edits another repository's
# files, and if its anchors stop matching, CI goes green while nothing ships.
# These tests are the thing that notices.

on:
  pull_request:
    paths:
      - 'tools/ci/**'
      # tools/ci/test_beast_pull_build_set.py exercises deploy/bin/beast-pull.
      # Without this path, a commit that changes ONLY the deploy agent would
      # skip its own test suite — and deploy-pin treats "no run" as "nothing
      # required", so the untested agent would ship straight to the robot.
      - 'robot/beast/ros2_ws/deploy/**'
      - '.github/workflows/ci-tools-tests.yml'
      - '.github/workflows/deploy-pin.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ci/**'
      # tools/ci/test_beast_pull_build_set.py exercises deploy/bin/beast-pull.
      # Without this path, a commit that changes ONLY the deploy agent would
      # skip its own test suite — and deploy-pin treats "no run" as "nothing
      # required", so the untested agent would ship straight to the robot.
      - 'robot/beast/ros2_ws/deploy/**'
      - '.github/workflows/ci-tools-tests.yml'
      - '.github/workflows/deploy-pin.yml'

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Same floor as the robot-side lanes so one interpreter covers both.
          python-version: '3.10'

      - run: pip install pytest
      - run: python -m pytest tools/ci -q
