# OpenHands Cold Review — operator checklist (do this before a wet-run)
#
# Workflow lives in this repo on purpose (v1). Do not convert it to a
# codeOps reusable later without an explicit rename decision.
#
# Environment: openhands-review (this repo)
#   secret   CODEX_AUTH_JSON_B64
#   secret   OPENHANDS_COLD_REVIEW_PRIVATE_KEY
#   variable OPENHANDS_COLD_REVIEW_APP_ID
#
# 1. Codex (trusted machine, ChatGPT login):
#    - `codex login --device-auth`
#    - Enable xhigh in Codex settings (required for gpt-5.6-luna/xhigh)
#    - `base64 -w0 ~/.codex/auth.json` → environment secret CODEX_AUTH_JSON_B64
#    First auth failure on a previously-working setup = re-login and rotate the
#    secret. Do not debug.
#
# 2. GitHub App "OpenHands Cold Review" (slug openhands-cold-review):
#    - Permissions: contents:read, pull-requests:write, issues:write, metadata:read
#    - No webhook (Actions delivers events)
#    - Install ONLY on MooseGooseConsulting/RobotOverview
#    - App ID → environment variable OPENHANDS_COLD_REVIEW_APP_ID
#    - PEM private key → environment secret OPENHANDS_COLD_REVIEW_PRIVATE_KEY
#
# 3. Label `review-this` already exists. Apply it to re-run a review.
#
# Full operator note: docs/openhands-cold-review.md
name: OpenHands Cold Review
on:
  pull_request:
    types: [opened, ready_for_review, labeled, synchronize]

concurrency:
  group: cold-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'review-this')
    runs-on: moosegoose-general
    environment: openhands-review
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: User-space gh
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v gh >/dev/null; then
            GH_URL="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | grep -oE 'https://github.com/cli/cli/releases/download/[^"]+_linux_amd64.tar.gz' | head -n1)"
            [ -n "$GH_URL" ] || { echo "Failed to resolve latest gh linux_amd64 tarball"; exit 1; }
            curl -fsSL "$GH_URL" | tar -xz --wildcards --strip-components=2 -C "$HOME/.local/bin" '*/bin/gh'
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.OPENHANDS_COLD_REVIEW_APP_ID }}
          private-key: ${{ secrets.OPENHANDS_COLD_REVIEW_PRIVATE_KEY }}
      - name: Restore Codex auth
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
        run: |
          [ -n "$CODEX_AUTH_JSON_B64" ] || { echo "CODEX_AUTH_JSON_B64 missing"; exit 1; }
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON_B64" | base64 -d > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
      - name: Run PR Review
        uses: OpenHands/extensions/plugins/pr-review@main
        with:
          agent-kind: acp
          acp-command: npx -y @agentclientprotocol/codex-acp
          llm-model: gpt-5.6-luna/xhigh
          github-token: ${{ steps.app.outputs.token }}
      - name: Cleanup Codex auth
        if: always()
        run: rm -f "$HOME/.codex/auth.json"
